services:
  # -------------------------------------------------------------
  # 1. Astroveda Next.js Storefront Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./astroveda
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1
    image: astroveda-storefront:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - spiritual_net

  # -------------------------------------------------------------
  # 2. JAPAM Flask REST API & Admin Backend (Gunicorn)
  # -------------------------------------------------------------
  backend:
    build:
      context: "./JAPAM - Copy"
      dockerfile: Dockerfile
    image: japam-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql+psycopg://japam_user:secure_japam_password_2024@postgres:5432/japam_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod-spiritual-secret-key-change-in-coolify}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-spiritual-secret-key-change-in-coolify}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-csrf-spiritual-protection-key-32chars}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-whsec_japam_webhook_secret_coolify}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=Lax
      - UPLOAD_FOLDER=/app/uploads
      - TIMEZONE=Asia/Kolkata
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:3000,https://store.yourdomain.com}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
    networks:
      - spiritual_net

  # -------------------------------------------------------------
  # 3. Asynchronous Background Worker
  # -------------------------------------------------------------
  worker:
    build:
      context: "./JAPAM - Copy"
      dockerfile: Dockerfile
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg://japam_user:secure_japam_password_2024@postgres:5432/japam_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod-spiritual-secret-key-change-in-coolify}
      - UPLOAD_FOLDER=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - spiritual_net

  # -------------------------------------------------------------
  # 4. PostgreSQL 16 Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: japam_user
      POSTGRES_PASSWORD: secure_japam_password_2024
      POSTGRES_DB: japam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japam_user -d japam_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    networks:
      - spiritual_net

  # -------------------------------------------------------------
  # 5. Redis 7 Cache & Rate Limiter
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - spiritual_net

# ---------------------------------------------------------------
# Persistent Volumes & Networks
# ---------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  spiritual_net:
    driver: bridge
